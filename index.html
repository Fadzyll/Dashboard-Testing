<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revenue Overview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #12161B;
    --surface: #181E25;
    --surface-alt: #1F2730;
    --border: #2C3742;
    --text: #EDEAE0;
    --text-dim: #8FA0AC;
    --gold: #C9A24B;
    --teal: #4C9A8B;
    --rose: #B5674A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 36px 24px 56px; }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
  }
  .eyebrow { font-size: 12px; color: var(--gold); letter-spacing: 0.03em; margin-bottom: 6px; }
  h1 { font-family: 'Spectral', serif; font-weight: 500; font-size: 32px; margin: 0; }

  .btns { display: flex; gap: 10px; }
  button {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; cursor: pointer;
    padding: 9px 16px; border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  }
  button.primary { background: var(--gold); color: #1A1508; border: none; font-weight: 600; padding: 9px 18px; }

  #dropzone {
    border: 1px dashed var(--border);
    background: var(--surface);
    padding: 70px 24px;
    text-align: center;
    cursor: pointer;
  }
  #dropzone.drag { border-color: var(--gold); background: var(--surface-alt); }
  #dropzone .title { font-family: 'Spectral', serif; font-size: 22px; margin-bottom: 8px; }
  #dropzone .sub { color: var(--text-dim); font-size: 13.5px; }
  #dropzone .err { color: var(--rose); margin-top: 16px; font-size: 13px; }

  .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; font-family: 'IBM Plex Mono', monospace; }

  /* filter bar */
  .filterbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 14px 16px; margin-bottom: 14px; align-items: center;
  }
  .filterbar input[type="text"],
  .filterbar input[type="date"],
  .filterbar select {
    background: var(--surface-alt); color: var(--text); border: 1px solid var(--border);
    padding: 8px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;
    min-width: 0;
  }
  .filterbar input[type="text"] { flex: 1 1 180px; }
  .filterbar select { flex: 0 1 160px; }
  .filterbar .date-group { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; flex: 0 0 auto; }
  .filterbar .date-group input { flex: 0 0 135px; }
  .filterbar button.reset { flex: 0 0 auto; }
  .hidden-field { display: none !important; }

  .grid { display: grid; gap: 14px; }
  .stats { grid-template-columns: 1.4fr 1fr 1fr 1fr; margin-bottom: 14px; }
  .charts { grid-template-columns: 1.6fr 1fr; margin-bottom: 14px; }
  @media (max-width: 780px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .charts { grid-template-columns: 1fr; }
    .filterbar { flex-direction: column; align-items: stretch; }
    .filterbar select, .filterbar .date-group input { flex: 1 1 auto; }
  }

  /* stat cards: fixed internal rhythm so every card lines up regardless of content */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 20px 22px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card .label { font-size: 12px; letter-spacing: 0.03em; color: var(--text-dim); min-height: 15px; }
  .card .value { font-family: 'Spectral', serif; font-size: 26px; line-height: 1.05; margin-top: 2px; }
  .card .sub { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: auto; min-height: 15px; }

  .panel { background: var(--surface); border: 1px solid var(--border); padding: 20px 20px 12px; }
  .panel .ptitle { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
  .panel canvas { max-height: 260px; }
  .empty-note { color: var(--text-dim); font-size: 13px; padding: 40px 0; text-align: center; }

  table.sd-table { border-collapse: collapse; width: 100%; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  table.sd-table th { text-align: left; padding: 10px 12px; color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border); font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; }
  table.sd-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  table.sd-table tr:nth-child(even) { background: var(--surface-alt); }
  .table-wrap { overflow-x: auto; }

  .clear-row { margin-top: 18px; text-align: right; }
  #fileInput { display: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Sales &amp; revenue</div>
      <h1>Revenue overview</h1>
    </div>
    <div class="btns">
      <button id="demoBtn">Load demo data</button>
      <button id="importBtn" class="primary">Import Excel file</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
    </div>
  </header>

  <div id="dropzone">
    <div class="title" id="dzTitle">Drop an Excel file here</div>
    <div class="sub">.xlsx, .xls, or .csv — parsed entirely in your browser, nothing leaves this page.</div>
    <div class="err hidden" id="dzError"></div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="meta" id="metaLine"></div>

    <div class="filterbar" id="filterBar">
      <input type="text" id="searchInput" placeholder="Search records…" />
      <select id="categoryFilter" class="hidden-field">
        <option value="">All categories</option>
      </select>
      <div class="date-group hidden-field" id="dateGroup">
        <span>From</span>
        <input type="date" id="dateFrom" />
        <span>to</span>
        <input type="date" id="dateTo" />
      </div>
      <button class="reset" id="resetFiltersBtn">Reset filters</button>
    </div>

    <div class="grid stats" id="statCards"></div>

    <div class="grid charts">
      <div class="panel">
        <div class="ptitle" id="catTitle">By category</div>
        <canvas id="barChart"></canvas>
        <div id="barEmpty" class="empty-note hidden">No categorical column detected to group by.</div>
      </div>
      <div class="panel">
        <div class="ptitle">Share of total</div>
        <canvas id="pieChart"></canvas>
        <div id="pieEmpty" class="empty-note hidden">—</div>
      </div>
    </div>

    <div class="panel hidden" id="trendPanel" style="margin-bottom:14px;">
      <div class="ptitle">Trend by month</div>
      <canvas id="trendChart"></canvas>
    </div>

    <div class="panel table-wrap">
      <div class="ptitle" id="tableTitle">First 10 rows</div>
      <table class="sd-table" id="dataTable"></table>
    </div>

    <div class="clear-row">
      <button id="clearBtn">Clear and import another file</button>
    </div>
  </div>
</div>

<script>
const COLORS = { gold: '#C9A24B', teal: '#4C9A8B', rose: '#B5674A', border: '#2C3742', textDim: '#8FA0AC', text: '#EDEAE0', surface: '#181E25' };
const SLICE_COLORS = ['#C9A24B', '#4C9A8B', '#B5674A', '#7A93A6', '#8E7A4C', '#5B8375', '#9C6B57', '#6E7F8C'];

let allRows = null;      // full parsed dataset, never mutated by filters
let cols = [];
let numCol = null, catCol = null, dateCol = null;
let charts = { bar: null, pie: null, trend: null };

const $ = (id) => document.getElementById(id);

function fmtNum(n) {
  return new Intl.NumberFormat('en-US', { maximumFractionDigits: n % 1 === 0 ? 0 : 2 }).format(n);
}
function fmtCurrency(n) {
  return `RM ${fmtNum(n)}`;
}
function monthLabel(key) {
  const [y, m] = key.split('-');
  return new Date(Number(y), Number(m) - 1, 1).toLocaleString('en-US', { month: 'short', year: '2-digit' });
}
function toDateInputValue(d) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function detectColumns(rows) {
  if (!rows.length) return [];
  const headers = Object.keys(rows[0]);
  return headers.map((h) => {
    const vals = rows.map((r) => r[h]).filter((v) => v !== undefined && v !== null && v !== '');
    if (!vals.length) return { name: h, type: 'string' };
    const numCount = vals.filter((v) => typeof v === 'number').length;
    const dateCount = vals.filter((v) => v instanceof Date && !isNaN(v)).length;
    if (numCount / vals.length > 0.7) return { name: h, type: 'number' };
    if (dateCount / vals.length > 0.7) return { name: h, type: 'date' };
    return { name: h, type: 'string' };
  });
}
function pickPrimaryNumeric(cols) {
  const kw = ['revenue', 'sales', 'amount', 'total', 'price', 'value', 'income', 'profit'];
  return cols.find((c) => c.type === 'number' && kw.some((k) => c.name.toLowerCase().includes(k))) ||
         cols.find((c) => c.type === 'number');
}
function pickCategory(cols) {
  const kw = ['product', 'category', 'item', 'region', 'customer', 'name', 'type', 'segment'];
  return cols.find((c) => c.type === 'string' && kw.some((k) => c.name.toLowerCase().includes(k))) ||
         cols.find((c) => c.type === 'string');
}
function pickDate(cols) { return cols.find((c) => c.type === 'date'); }

function groupSum(rows, catColName, numColName, topN = 7) {
  const map = new Map();
  rows.forEach((r) => {
    const key = r[catColName] === undefined || r[catColName] === null || r[catColName] === '' ? 'Unspecified' : String(r[catColName]);
    const val = Number(r[numColName]) || 0;
    map.set(key, (map.get(key) || 0) + val);
  });
  const arr = Array.from(map, ([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  if (arr.length > topN) {
    const top = arr.slice(0, topN);
    const rest = arr.slice(topN).reduce((s, x) => s + x.value, 0);
    top.push({ name: 'Other', value: rest });
    return top;
  }
  return arr;
}
function groupByMonth(rows, dateColName, numColName) {
  const map = new Map();
  rows.forEach((r) => {
    const d = r[dateColName];
    if (!(d instanceof Date) || isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    map.set(key, (map.get(key) || 0) + (Number(r[numColName]) || 0));
  });
  return Array.from(map, ([month, value]) => ({ month, value })).sort((a, b) => a.month.localeCompare(b.month));
}

function buildSample() {
  const products = ['Kopi Blend', 'Durian Puree', 'Sabah Tea', 'Hibiscus Syrup', 'Pineapple Jam'];
  const rows = [];
  const start = new Date(2025, 9, 1);
  for (let i = 0; i < 90; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const n = 1 + Math.floor(Math.random() * 4);
    for (let j = 0; j < n; j++) {
      rows.push({
        Date: d,
        Product: products[Math.floor(Math.random() * products.length)],
        Revenue: Math.round(20 + Math.random() * 480),
        Units: 1 + Math.floor(Math.random() * 12),
      });
    }
  }
  return rows;
}

// sub is always rendered (as a non-breaking space if empty) so every card keeps the same height/rhythm
function statCard(label, value, sub, big) {
  return `<div class="card ${big ? 'big' : ''}">
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    <div class="sub">${sub || '&nbsp;'}</div>
  </div>`;
}

// ---------- filtering ----------
function setupFilterBar() {
  const categorySelect = $('categoryFilter');
  const dateGroup = $('dateGroup');

  if (catCol) {
    const unique = Array.from(new Set(allRows.map((r) => r[catCol.name]).filter((v) => v !== null && v !== undefined && v !== ''))).sort();
    categorySelect.innerHTML = `<option value="">All ${catCol.name}</option>` + unique.map((v) => `<option value="${String(v).replace(/"/g, '&quot;')}">${v}</option>`).join('');
    categorySelect.classList.remove('hidden-field');
  } else {
    categorySelect.classList.add('hidden-field');
  }

  if (dateCol) {
    const dates = allRows.map((r) => r[dateCol.name]).filter((d) => d instanceof Date && !isNaN(d));
    if (dates.length) {
      const min = new Date(Math.min(...dates));
      const max = new Date(Math.max(...dates));
      $('dateFrom').min = toDateInputValue(min);
      $('dateFrom').max = toDateInputValue(max);
      $('dateTo').min = toDateInputValue(min);
      $('dateTo').max = toDateInputValue(max);
      $('dateFrom').value = '';
      $('dateTo').value = '';
    }
    dateGroup.classList.remove('hidden-field');
  } else {
    dateGroup.classList.add('hidden-field');
  }

  $('searchInput').value = '';
}

function getFilteredRows() {
  const search = $('searchInput').value.trim().toLowerCase();
  const category = $('categoryFilter').value;
  const dateFrom = $('dateFrom').value ? new Date($('dateFrom').value + 'T00:00:00') : null;
  const dateTo = $('dateTo').value ? new Date($('dateTo').value + 'T23:59:59') : null;

  return allRows.filter((r) => {
    if (category && catCol && String(r[catCol.name]) !== category) return false;
    if (dateCol && (dateFrom || dateTo)) {
      const d = r[dateCol.name];
      if (!(d instanceof Date) || isNaN(d)) return false;
      if (dateFrom && d < dateFrom) return false;
      if (dateTo && d > dateTo) return false;
    }
    if (search) {
      const hit = cols.some((c) => {
        const v = r[c.name];
        if (v === null || v === undefined) return false;
        const s = v instanceof Date ? v.toLocaleDateString() : String(v);
        return s.toLowerCase().includes(search);
      });
      if (!hit) return false;
    }
    return true;
  });
}

function applyFilters() {
  renderDashboard(getFilteredRows());
}

// ---------- rendering ----------
function renderDashboard(rows) {
  $('dashboard').classList.remove('hidden');
  $('dropzone').classList.add('hidden');

  if (!numCol) {
    $('dashboard').innerHTML = `<div class="panel" style="color:${COLORS.rose}">No numeric column detected — need at least one column of numbers to build stats.</div>`;
    return;
  }

  const totalRows = allRows.length;
  $('metaLine').textContent = rows.length === totalRows
    ? `${window.__fileName} · ${totalRows} rows · summing "${numCol.name}"${catCol ? ` · grouped by "${catCol.name}"` : ''}${dateCol ? ` · trend by "${dateCol.name}"` : ''}`
    : `${window.__fileName} · showing ${rows.length} of ${totalRows} rows (filtered) · summing "${numCol.name}"`;

  Object.values(charts).forEach((c) => c && c.destroy());

  if (!rows.length) {
    $('statCards').innerHTML = statCard(`Total ${numCol.name}`, 'RM 0', 'no matching records', true) +
      statCard('Average per record', '—') + statCard('Highest single value', '—') + statCard('Records', '0');
    $('barChart').classList.add('hidden'); $('pieChart').classList.add('hidden');
    $('barEmpty').classList.remove('hidden'); $('pieEmpty').classList.remove('hidden');
    $('barEmpty').textContent = 'No records match your filters.';
    $('pieEmpty').textContent = 'No records match your filters.';
    $('trendPanel').classList.add('hidden');
    $('tableTitle').textContent = 'No matching rows';
    $('dataTable').innerHTML = '';
    return;
  }

  const values = rows.map((r) => Number(r[numCol.name]) || 0);
  const total = values.reduce((s, v) => s + v, 0);
  const avg = total / rows.length;
  const max = Math.max(...values);
  const maxRow = rows[values.indexOf(max)];
  const byCategory = catCol ? groupSum(rows, catCol.name, numCol.name) : null;
  const byMonth = dateCol ? groupByMonth(rows, dateCol.name, numCol.name) : null;

  $('statCards').innerHTML =
    statCard(`Total ${numCol.name}`, fmtCurrency(total), `across ${rows.length} records`, true) +
    statCard('Average per record', fmtCurrency(Math.round(avg))) +
    statCard('Highest single value', fmtCurrency(max), catCol ? String(maxRow[catCol.name] ?? '') : '') +
    statCard('Records', fmtNum(rows.length), dateCol ? `${byMonth?.length || 0} months covered` : '');

  $('catTitle').textContent = catCol ? `By ${catCol.name}` : 'Breakdown';

  if (byCategory) {
    $('barEmpty').classList.add('hidden');
    $('pieEmpty').classList.add('hidden');
    $('barChart').classList.remove('hidden');
    $('pieChart').classList.remove('hidden');

    charts.bar = new Chart($('barChart'), {
      type: 'bar',
      data: {
        labels: byCategory.map((d) => d.name),
        datasets: [{ data: byCategory.map((d) => d.value), backgroundColor: byCategory.map((_, i) => SLICE_COLORS[i % SLICE_COLORS.length]) }],
      },
      options: {
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => fmtCurrency(ctx.parsed.y) } } },
        scales: {
          x: { ticks: { color: COLORS.textDim, font: { family: 'IBM Plex Sans', size: 11 } }, grid: { display: false } },
          y: { ticks: { color: COLORS.textDim, font: { family: 'IBM Plex Mono', size: 11 } }, grid: { color: COLORS.border } },
        },
      },
    });

    charts.pie = new Chart($('pieChart'), {
      type: 'doughnut',
      data: {
        labels: byCategory.map((d) => d.name),
        datasets: [{ data: byCategory.map((d) => d.value), backgroundColor: byCategory.map((_, i) => SLICE_COLORS[i % SLICE_COLORS.length]), borderColor: COLORS.surface }],
      },
      options: {
        plugins: {
          legend: { position: 'bottom', labels: { color: COLORS.textDim, font: { family: 'IBM Plex Sans', size: 11 }, boxWidth: 10 } },
          tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${fmtCurrency(ctx.parsed)}` } },
        },
      },
    });
  } else {
    $('barChart').classList.add('hidden');
    $('pieChart').classList.add('hidden');
    $('barEmpty').textContent = 'No categorical column detected to group by.';
    $('pieEmpty').textContent = '—';
    $('barEmpty').classList.remove('hidden');
    $('pieEmpty').classList.remove('hidden');
  }

  if (byMonth && byMonth.length > 1) {
    $('trendPanel').classList.remove('hidden');
    charts.trend = new Chart($('trendChart'), {
      type: 'line',
      data: {
        labels: byMonth.map((d) => monthLabel(d.month)),
        datasets: [{
          data: byMonth.map((d) => d.value),
          borderColor: COLORS.teal,
          backgroundColor: 'rgba(76,154,139,0.25)',
          fill: true, tension: 0.35, pointRadius: 2,
        }],
      },
      options: {
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => fmtCurrency(ctx.parsed.y) } } },
        scales: {
          x: { ticks: { color: COLORS.textDim, font: { family: 'IBM Plex Sans', size: 11 } }, grid: { display: false } },
          y: { ticks: { color: COLORS.textDim, font: { family: 'IBM Plex Mono', size: 11 } }, grid: { color: COLORS.border } },
        },
      },
    });
  } else {
    $('trendPanel').classList.add('hidden');
  }

  const previewRows = rows.slice(0, 10);
  $('tableTitle').textContent = rows.length > 10 ? `First 10 of ${rows.length} rows` : `All ${rows.length} rows`;
  const thead = `<thead><tr>${cols.map((c) => `<th>${c.name}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${previewRows.map((r) => `<tr>${cols.map((c) => {
    const v = r[c.name];
    let out = '';
    if (v instanceof Date) out = v.toLocaleDateString();
    else if (v === null || v === undefined) out = '';
    else if (typeof v === 'number') out = (numCol && c.name === numCol.name) ? fmtCurrency(v) : fmtNum(v);
    else out = String(v);
    return `<td>${out}</td>`;
  }).join('')}</tr>`).join('')}</tbody>`;
  $('dataTable').innerHTML = thead + tbody;
}

function loadDataset(rows, fileName) {
  allRows = rows;
  window.__fileName = fileName;
  cols = detectColumns(allRows);
  numCol = pickPrimaryNumeric(cols);
  catCol = pickCategory(cols);
  dateCol = pickDate(cols);
  setupFilterBar();
  applyFilters();
}

function parseFile(file) {
  $('dzError').classList.add('hidden');
  $('dzTitle').textContent = 'Reading file…';
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: null });
      if (!json.length) throw new Error('empty');
      loadDataset(json, file.name);
    } catch (err) {
      $('dzTitle').textContent = 'Drop an Excel file here';
      $('dzError').textContent = "Could not read that file. Make sure it's a valid .xlsx, .xls, or .csv file.";
      $('dzError').classList.remove('hidden');
    }
  };
  reader.onerror = () => {
    $('dzTitle').textContent = 'Drop an Excel file here';
    $('dzError').textContent = 'Something went wrong reading the file.';
    $('dzError').classList.remove('hidden');
  };
  reader.readAsArrayBuffer(file);
}

// wiring
$('importBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', (e) => e.target.files[0] && parseFile(e.target.files[0]));
$('dropzone').addEventListener('click', () => $('fileInput').click());
$('dropzone').addEventListener('dragover', (e) => { e.preventDefault(); $('dropzone').classList.add('drag'); });
$('dropzone').addEventListener('dragleave', () => $('dropzone').classList.remove('drag'));
$('dropzone').addEventListener('drop', (e) => {
  e.preventDefault();
  $('dropzone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) parseFile(file);
});
$('demoBtn').addEventListener('click', () => loadDataset(buildSample(), 'sample_sales.xlsx (demo data)'));
$('clearBtn').addEventListener('click', () => {
  allRows = null;
  $('dashboard').classList.add('hidden');
  $('dropzone').classList.remove('hidden');
  $('fileInput').value = '';
});

let searchDebounce;
$('searchInput').addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(applyFilters, 150);
});
$('categoryFilter').addEventListener('change', applyFilters);
$('dateFrom').addEventListener('change', applyFilters);
$('dateTo').addEventListener('change', applyFilters);
$('resetFiltersBtn').addEventListener('click', () => {
  $('searchInput').value = '';
